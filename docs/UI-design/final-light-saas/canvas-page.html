<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LiveFlows — Canvas page (light SaaS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1e293b; --ink-soft:#64748b; --ink-faint:#94a3b8; --line:#e2e8f0; --bg:#f8fafc;
    --accent:#2563eb; --accent-soft:#eff6ff;
    --success:#16a34a; --success-soft:#f0fdf4; --warn:#d97706; --warn-soft:#fffbeb;
    --card:#ffffff; --shadow:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --radius:12px; --radius-sm:8px; --mono:'Geist Mono', monospace; --sans:'Geist', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
  .page{display:flex;flex-direction:column;height:100vh;}

  .topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;background:var(--card);}
  .back{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;}
  .back:hover{background:var(--bg);}
  .crumb{font-size:13.5px;color:var(--ink-faint);}
  .crumb b{color:var(--ink);font-weight:600;}
  .topbar .spacer{flex:1;}

  .sync-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--success);font-weight:500;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
  .sync-status.reconnecting{color:var(--warn);}
  .sync-status.reconnecting .sync-dot{background:var(--warn);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .presence{display:flex;margin-left:8px;}
  .presence-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);border:2px solid var(--card);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff;font-weight:600;}
  .presence-avatar:first-child{margin-left:0;}
  .presence-avatar.you{background:var(--ink-faint);}

  .btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

  .canvas-wrap{flex:1;position:relative;background:#ffffff;overflow:hidden;}
  /* Placeholder ONLY -- the real canvas is the @excalidraw/excalidraw package's own
     chrome and rendering; this file does not attempt to redesign it. */
  .canvas-placeholder{position:absolute;inset:0;background-image:radial-gradient(circle, #e2e8f0 1px, transparent 1px);background-size:20px 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--ink-faint);}
  .canvas-note{font-size:13px;font-family:var(--mono);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 14px;box-shadow:var(--shadow);}

  .readonly-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--warn-soft);border:1px solid #fde68a;color:#92400e;font-size:12.5px;padding:8px 14px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="back">←</div>
    <div class="crumb">acme-eng / Projects / <b>Checkout redesign</b></div>
    <div class="spacer"></div>
    <div class="sync-status"><span class="sync-dot"></span>Synced</div>
    <div class="presence">
      <div class="presence-avatar you">D</div>
      <div class="presence-avatar">M</div>
    </div>
    <button class="btn">Share</button>
  </div>
  <div class="canvas-wrap">
    <!-- Read-only fallback banner shown only when Liveblocks is unreachable
         and the canvas is rendering from the Postgres CanvasSnapshot mirror.
         Hidden in the normal connected state. -->
    <div class="readonly-banner" style="display:none;">⚠ Viewing a cached copy — realtime sync is temporarily unavailable</div>
    <div class="canvas-placeholder">
      <div class="canvas-note">@excalidraw/excalidraw renders here — its own toolbar, hand-drawn tools, and canvas chrome are untouched by this design</div>
    </div>
  </div>
</div>
</body>
</html>
