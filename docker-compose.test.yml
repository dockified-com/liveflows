services:
  postgres-test:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: liveflows_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d liveflows_test"]
      interval: 2s
      timeout: 5s
      retries: 10
